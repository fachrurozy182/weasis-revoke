[workspace]
resolver = "3"
members = [
    "crates/weasis-core",
    "crates/weasis-net",
    "crates/weasis-web",
    "crates/weasis-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "EPL-2.0 OR Apache-2.0"
repository = "https://github.com/fachrurozy182/weasis-revoke"

[workspace.dependencies]
weasis-core = { path = "crates/weasis-core" }
weasis-net = { path = "crates/weasis-net" }

# DICOM toolkit (decision D4). dicom-pixeldata only decodes native, RLE and deflated data:
# `rayon` threads are not available in the browser and its JPEG/JPEG 2000 codecs are
# replaced by the pure-Rust codecs below (decision D14).
dicom-object = { version = "0.10.0", features = ["deflate"] }
dicom-dictionary-std = "0.10.0"
dicom-transfer-syntax-registry = { version = "0.10.0", default-features = false }
dicom-pixeldata = { version = "0.10.0", default-features = false, features = ["rle", "deflate"] }

# Pure-Rust image codecs that also compile to WebAssembly (decision D14).
oxiarc-jpeg = "0.4.2"
jpegls = { package = "pure_jpegls", version = "2.0.0" }
oxideav-jpeg2000 = { version = "0.0.17", default-features = false }

# Error types (docs/CODING-GUIDE.md §5).
thiserror = "2.0.21"

# Frontend (decision D2).
leptos = { version = "0.8.22", features = ["csr"] }
console_error_panic_hook = "0.1.7"

# Backend (decision D5).
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Test-only: run the same tests inside WebAssembly.
wasm-bindgen-test = "0.3.79"

# Lint rules from docs/CODING-GUIDE.md §1.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Optimize dependencies (codecs) even in debug builds: unoptimized decoding is ~50x slower.
[profile.dev.package."*"]
opt-level = 2
