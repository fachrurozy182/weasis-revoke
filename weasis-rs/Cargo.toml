[workspace]
resolver = "3"
members = [
    "crates/weasis-core",
    "crates/weasis-net",
    "crates/weasis-web",
    "crates/weasis-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "EPL-2.0 OR Apache-2.0"
repository = "https://github.com/fachrurozy182/weasis-revoke"

[workspace.dependencies]
weasis-core = { path = "crates/weasis-core" }
weasis-net = { path = "crates/weasis-net" }

# Lint rules from docs/CODING-GUIDE.md §1.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
