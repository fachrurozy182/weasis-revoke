# Build the frontend with `trunk build` (or `trunk build --release`) from this folder.
# The output in `dist/` is served by `weasis-server`.
[build]
target = "index.html"
dist = "dist"
# Stable file names: the page starts the import worker by the name of its loader
# (`import_worker_loader.js`), which Trunk does not tell the page.
filehash = false
